[package]
name = "vgo-raster"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
iteration-lab = ["vgo-search/iteration-lab"]


[dependencies]
half = "2.7"
vgo-core = { path = "../vgo-core" }
vgo-search = { path = "../vgo-search" }

[lib]
path = "src/lib.rs"

# Called by training/vgo_training/dataset.py to rasterize and pack shards.
[[bin]]
name = "vgo-render-shard"
path = "src/bin/render_shard.rs"

[[bin]]
name = "vgo-pack-shard"
path = "src/bin/pack_shard.rs"
