[package]
name = "vgo-inference"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
# Blackwell (sm_120) has no prebuilt onnxruntime with matching kernels, so we
# load a self-built libonnxruntime.so at runtime via ORT_DYLIB_PATH instead of
# the crate's downloaded binary. The CUDA and TensorRT EPs still register
# through the dynamically loaded library. See docs/NVRTX_HANDOFF.md.
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["load-dynamic", "std", "ndarray", "tracing", "api-24"] }
sha2 = "0.10"
vgo-core = { path = "../vgo-core" }
vgo-raster = { path = "../vgo-raster" }
vgo-search = { path = "../vgo-search" }

[lib]
path = "src/lib.rs"

[[bin]]
name = "vgo-stage-bench"
path = "src/bin/stage_bench.rs"

[[bin]]
name = "vgo-onnx-bench"
path = "src/bin/onnx_bench.rs"
