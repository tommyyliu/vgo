[package]
name = "vgo-inference"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
ort = { version = "=2.0.0-rc.12", features = ["cuda", "tensorrt"] }
sha2 = "0.10"
vgo-core = { path = "../vgo-core" }
vgo-raster = { path = "../vgo-raster" }
vgo-search = { path = "../vgo-search" }

[lib]
path = "src/lib.rs"

[[bin]]
name = "vgo-model-smoke"
path = "src/bin/model_smoke.rs"

[[bin]]
name = "vgo-stage-bench"
path = "src/bin/stage_bench.rs"

[[bin]]
name = "vgo-onnx-bench"
path = "src/bin/onnx_bench.rs"
