[package]
name = "vgo-selfplay"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# Pass through to vgo-raster; see rasterize_compact_into.
distance-settled = ["vgo-raster/distance-settled"]
default = []

[dependencies]
clap.workspace = true
sha2 = "0.10"
vgo-core = { path = "../vgo-core" }
vgo-inference = { path = "../vgo-inference" }
vgo-raster = { path = "../vgo-raster" }
vgo-search = { path = "../vgo-search" }

[lib]
path = "src/lib.rs"

[[bin]]
name = "vgo-canary"
path = "src/main.rs"

[[bin]]
name = "vgo-model-smoke"
path = "src/model_smoke.rs"

[[bin]]
name = "vgo-generate-demo"
path = "src/generate_demo.rs"

[[bin]]
name = "vgo-arena"
path = "src/arena.rs"

[[bin]]
name = "vgo-playout-duel"
path = "src/playout_duel.rs"

[[bin]]
name = "vgo-render-board"
path = "src/render_board.rs"

[[bin]]
name = "vgo-serve-move"
path = "src/serve_move.rs"

[[bin]]
name = "vgo-generation-bench"
path = "src/generation_bench.rs"

[[bin]]
name = "vgo-feed-bench"
path = "src/feed_bench.rs"

[[bin]]
name = "vgo-tournament"
path = "src/tournament.rs"
