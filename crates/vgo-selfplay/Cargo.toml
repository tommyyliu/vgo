[package]
name = "vgo-selfplay"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
iteration-lab = ["vgo-search/iteration-lab"]
profiling = ["dep:pprof"]
default = []

[dependencies]
# For `use_blocking_sync` only -- the driver flag that stops the inference
# threads busy-polling while the GPU works. cudarc loads libcuda at runtime, so
# this adds no link-time CUDA requirement.
vgo-raster-cuda = { path = "../vgo-raster-cuda" }
# In-process sampling profiler, behind a feature so it costs nothing when off.
# `perf` is not installed here and needs root to install; pprof samples with
# SIGPROF from inside the process, which needs neither. Symbols are already in
# the release build (`debug = true` in the profile, which costs binary size and
# compile time but nothing at run time).
pprof = { version = "0.15", features = ["flamegraph"], optional = true }
clap.workspace = true
sha2 = "0.10"
vgo-core = { path = "../vgo-core" }
vgo-inference = { path = "../vgo-inference" }
vgo-raster = { path = "../vgo-raster" }
vgo-search = { path = "../vgo-search" }

[lib]
path = "src/lib.rs"

[[bin]]
name = "vgo-canary"
path = "src/main.rs"

[[bin]]
name = "vgo-model-smoke"
path = "src/model_smoke.rs"

[[bin]]
name = "vgo-generate-demo"
path = "src/generate_demo.rs"

[[bin]]
name = "vgo-generate-continuous"
path = "src/generate_continuous.rs"

[[bin]]
name = "vgo-arena"
path = "src/arena.rs"

[[bin]]
name = "vgo-playout-duel"
path = "src/playout_duel.rs"

[[bin]]
name = "vgo-render-board"
path = "src/render_board.rs"

[[bin]]
name = "vgo-serve-move"
path = "src/serve_move.rs"

[[bin]]
name = "vgo-generation-bench"
path = "src/generation_bench.rs"

[[bin]]
name = "vgo-feed-bench"
path = "src/feed_bench.rs"

[[bin]]
name = "vgo-tournament"
path = "src/tournament.rs"
