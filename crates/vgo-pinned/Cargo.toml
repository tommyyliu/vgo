[package]
name = "vgo-pinned"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# Page-locked host memory for the GPU inference lanes. The CUDA driver calls are
# unsafe, and vgo-inference forbids unsafe code, so they live here behind a safe
# interface. cudarc loads libcuda at runtime: no link-time CUDA requirement.
[dependencies]
cudarc = { version = "0.19", default-features = false, features = [
    "driver", "cuda-13000", "fallback-dynamic-loading", "std",
] }
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["load-dynamic", "std", "api-24"] }

[lib]
path = "src/lib.rs"
