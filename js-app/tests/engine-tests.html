<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>VGO engine tests</title></head>
<body>
<pre id="result">RUNNING</pre>
<script src="../src/engine/numeric.js"></script>
<script src="../src/engine/model.js"></script>
<script src="../src/geometry/voronoi.js"></script>
<script src="../src/geometry/legal-set.js"></script>
<script src="../src/geometry/settled-contour.js"></script>
<script src="../src/engine/analysis.js"></script>
<script src="../src/engine/game.js"></script>
<script src="../src/io/vgo-sgf.js"></script>
<script>
"use strict";
(function () {
  const failures = [];
  let passed = 0;
  function test(name, body) {
    try { body(); passed++; }
    catch (error) { failures.push(name + ': ' + error.message); }
  }
  function assert(condition, message) {
    if (!condition) throw new Error(message || 'assertion failed');
  }
  function near(actual, expected, tolerance) {
    assert(Math.abs(actual - expected) <= tolerance,
      'expected ' + actual + ' to be within ' + tolerance + ' of ' + expected);
  }
  function position(stones, extra) {
    return VGO.model.createPosition(Object.assign({ radius:0.05, stones:stones, toMove:'B' }, extra));
  }

  test('positions are deeply immutable', function () {
    const value = position([{ x:0.25, y:0.25, c:'B' }]);
    assert(Object.isFrozen(value) && Object.isFrozen(value.stones) && Object.isFrozen(value.stones[0]));
    let threw = false;
    try { value.stones.push({ x:0.5, y:0.5, c:'W' }); } catch (_) { threw = true; }
    assert(threw, 'a frozen stone list accepted a mutation');
  });

  test('two-site geometry has exact area and sourced shared edges', function () {
    const value = position([{ x:0.25, y:0.5, c:'B' }, { x:0.75, y:0.5, c:'W' }]);
    const geometry = VGO.voronoi.compute(value);
    near(geometry.cells[0].area, 0.5, 1e-12);
    near(geometry.cells[1].area, 0.5, 1e-12);
    assert(geometry.adj[0].has(1) && geometry.adj[1].has(0), 'shared edge was not adjacency');
    assert(geometry.cells[0].edges.some(function (edge) {
      return edge.source && edge.source.kind === 'bisector' && edge.j === 1;
    }), 'shared edge lost its bisector provenance');
    assert(geometry.diagnostics.unclassifiedEdges === 0, 'an edge was unclassified');
  });

  test('point contacts do not connect diagonal groups', function () {
    const value = position([
      { x:0.25, y:0.25, c:'B' }, { x:0.75, y:0.25, c:'W' },
      { x:0.75, y:0.75, c:'B' }, { x:0.25, y:0.75, c:'W' },
    ]);
    const geometry = VGO.voronoi.compute(value);
    assert(!geometry.adj[0].has(2), 'diagonal cells touching at one point became adjacent');
    assert(geometry.group[0] !== geometry.group[2], 'diagonal black stones became one group');
  });

  test('placement boundaries are closed and overlap interiors are illegal', function () {
    const value = position([{ x:0.5, y:0.5, c:'B' }], { radius:0.1 });
    assert(VGO.legalSet.contains(value, 0.7, 0.5), 'exactly touching disks should be legal');
    assert(!VGO.legalSet.contains(value, 0.69, 0.5), 'overlapping disks should be illegal');
    assert(VGO.legalSet.contains(value, 0.1, 0.1), 'a disk tangent to two board edges should fit');
  });

  test('capture boundary comparison is strict and robust', function () {
    const escape = VGO.numeric.strictlyCloser(0, 0, 1 - 5e-8, 0, 1, 0);
    const capture = VGO.numeric.strictlyCloser(0, 0, 1 + 5e-8, 0, 1, 0);
    const oneUlpEscape = VGO.numeric.strictlyCloser(0, 0, 1 - Number.EPSILON / 2, 0, 1, 0);
    const oneUlpCapture = VGO.numeric.strictlyCloser(0, 0, 1 + Number.EPSILON, 0, 1, 0);
    const tie = VGO.numeric.strictlyCloser(0.25, 0.25, 0.75, 0.75, 0.75, 0.75);
    assert(escape.isStrictlyLess, 'an escape inside the former deadband was rejected');
    assert(!capture.isStrictlyLess, 'a candidate beyond the threshold was accepted');
    assert(oneUlpEscape.isStrictlyLess && oneUlpEscape.usedExactFallback,
      'the exact fallback lost a one-ULP escape');
    assert(!oneUlpCapture.isStrictlyLess && oneUlpCapture.usedExactFallback,
      'the exact fallback accepted a one-ULP capture');
    assert(!tie.isStrictlyLess, 'an exact tie transferred positive area');
    assert(tie.usedExactFallback, 'an indeterminate tie skipped the exact fallback');
    assert(escape.errorBound > 0 && tie.errorBound > 0, 'comparison error was not bounded');
  });

  test('setup validation distinguishes invalid, tangent, and valid diagrams', function () {
    const outside = position([{ x:0.02, y:0.5, c:'B' }], { radius:0.1 });
    const duplicate = position([{ x:0.5, y:0.5, c:'B' }, { x:0.5, y:0.5, c:'W' }]);
    const tangent = position([{ x:0.4, y:0.5, c:'B' }, { x:0.6, y:0.5, c:'W' }], { radius:0.1 });
    const valid = position([{ x:0.2, y:0.2, c:'B' }, { x:0.8, y:0.8, c:'W' }]);
    assert(!VGO.model.validate(outside).playable, 'out-of-board stone was accepted');
    assert(!VGO.model.validate(duplicate).playable, 'duplicate centers were accepted');
    assert(VGO.model.validate(tangent).playable, 'tangent stones were rejected');
    assert(VGO.model.validate(valid).playable, 'valid diagram was rejected');
  });

  test('a fully covered legal set settles every group', function () {
    const value = position([
      { x:0.25, y:0.25, c:'B' }, { x:0.75, y:0.25, c:'W' },
      { x:0.75, y:0.75, c:'B' }, { x:0.25, y:0.75, c:'W' },
    ], { radius:0.25 });
    const result = VGO.analysis.analyze(value);
    assert(result.validation.playable, result.validation.issues.join('; '));
    assert(result.legalVertices.length === 0, 'covered legal set unexpectedly has a vertex');
    assert(result.settledGroups.size === 4, 'not every isolated group was settled');
  });

  test('a fully settled board produces a closed contour', function () {
    const value = position([
      { x:0.25, y:0.25, c:'B' }, { x:0.75, y:0.25, c:'W' },
      { x:0.75, y:0.75, c:'B' }, { x:0.25, y:0.75, c:'W' },
    ], { radius:0.25 });
    const contour = VGO.settledContour.compute(value);
    assert(contour.openChains === 0 && contour.badVertices === 0, 'board contour topology is open');
    assert(contour.loops.length === 1, 'settled board did not produce one boundary loop');
  });

  test('settled regions are star-shaped about their stone and reach at least r', function () {
    const value = position([{ x:0.3, y:0.4, c:'B' }, { x:0.65, y:0.55, c:'W' }], { radius:0.06 });
    const contour = VGO.settledContour.compute(value);
    assert(contour.loops.length === 2, 'expected one region per stone');
    value.stones.forEach(function (stone, index) {
      const loop = contour.loops[index];
      assert(loop.length >= 3, 'region ' + index + ' is degenerate');
      let previous = Math.atan2(loop[0][1] - stone.y, loop[0][0] - stone.x);
      let turned = 0;
      loop.forEach(function (point) {
        const distance = Math.hypot(point[0] - stone.x, point[1] - stone.y);
        // A16: T >= r, up to the legal-set epsilon recorded in the numerical policy.
        assert(distance >= value.radius - VGO.numeric.coordinateEpsilon,
          'region ' + index + ' came inside the stone disk: ' + distance);
        const angle = Math.atan2(point[1] - stone.y, point[0] - stone.x);
        let step = angle - previous;
        while (step <= -Math.PI) step += 2 * Math.PI;
        while (step > Math.PI) step -= 2 * Math.PI;
        assert(step >= -1e-9, 'region ' + index + ' is not sampled at increasing angle');
        turned += step; previous = angle;
      });
      assert(Math.abs(turned) < 2 * Math.PI, 'region ' + index + ' wound past one revolution');
    });
  });

  test('an isolated stone settles exactly its radius-r disk', function () {
    // A16: T(u) = r exactly when s + 2r u is legal, which it is in open space.
    const value = position([{ x:0.5, y:0.5, c:'B' }], { radius:0.05 });
    const loop = VGO.settledContour.compute(value).loops[0];
    loop.forEach(function (point) {
      near(Math.hypot(point[0] - 0.5, point[1] - 0.5), 0.05, 1e-9);
    });
  });

  test('moves are pure transactions', function () {
    const before = position([]);
    const result = VGO.game.place(before, 0.5, 0.5);
    assert(result.ok, result.reason);
    assert(before.stones.length === 0 && before.toMove === 'B', 'input position was mutated');
    assert(result.position.stones.length === 1 && result.position.toMove === 'W', 'move result is wrong');
    assert(result.analysis.position === result.position, 'analysis does not describe the returned position');
  });

  test('two passes finish and preserve the score', function () {
    const start = position([{ x:0.25, y:0.5, c:'B' }, { x:0.75, y:0.5, c:'W' }]);
    const score = VGO.analysis.analyze(start).scores.B;
    const first = VGO.game.pass(start);
    const second = VGO.game.pass(first.position);
    assert(first.ok && first.position.phase === 'playing' && first.position.toMove === 'W');
    assert(second.ok && second.position.phase === 'finished');
    near(second.analysis.scores.B, score, 1e-12);
    assert(!VGO.game.pass(second.position).ok, 'post-game pass was accepted');
    assert(!VGO.game.place(second.position, 0.5, 0.5).ok, 'post-game placement was accepted');
  });

  // A placement that captures exactly one enemy stone leaves the stone count
  // untouched while changing the board completely. Read as a pass, two of these
  // in a row finished this real game at ply 44 -- scoring a position neither
  // player had passed on. Plies 43 and 44 are the even trades; every ply here
  // is a placement, so the game must still be playing at the end.
  //
  // Mirrors an_even_trade_is_not_a_pass in crates/vgo-core/src/game.rs.
  const EVEN_TRADE_GAME =
    '(;FF[4]GM[VGO]SZ[1]RA[0.055714285714285716]PL[B];B[0.519531,0.496094];W[0.53515625,0.71484375]' +
    ';B[0.378906,0.519531];W[0.59765625,0.23828125];B[0.660156,0.488281];W[0.36328125,0.25390625]' +
    ';B[0.347656,0.667969];W[0.37890625,0.81640625];B[0.230469,0.792969]' +
    ';W[0.24155634060202594,0.9038455992765371];B[0.113281,0.886719];W[0.69140625,0.70703125]' +
    ';B[0.769531,0.613281];W[0.8440734679885532,0.6961059349829543];B[0.917969,0.589844]' +
    ';W[0.9442857142857143,0.7448279240914601];B[0.261719,0.417969];W[0.18359375,0.28515625]' +
    ';B[0.097656,0.371094];W[0.74609375,0.26953125];B[0.097656,0.207031]' +
    ';W[0.1815156102469017,0.1336544699785221];B[0.089844,0.066406];W[0.36328125,0.08203125]' +
    ';B[0.792969,0.402344];W[0.89453125,0.33984375];B[0.442074,0.332699]' +
    ';W[0.4864982006504679,0.23050780769204193];B[0.894531,0.451273]' +
    ';W[0.4431630138148883,0.6105672604713251];B[0.832031,0.121094]' +
    ';W[0.5396564125988921,0.3864969752419616];B[0.199219,0.605469];W[0.07421875,0.60546875]' +
    ';B[0.792969,0.886719];W[0.66796875,0.88671875];B[0.628906,0.082031]' +
    ';W[0.7226365745353382,0.14228984819701174];B[0.472656,0.917969]' +
    ';W[0.6839238463317968,0.3794157673984005];B[0.113281,0.488281]' +
    ';W[0.6589316771545608,0.5997038436377342];B[0.121094,0.714844];W[0.49609375,0.09765625])';

  test('an even trade is not a pass', function () {
    const record = VGO.sgf.parseRecord(EVEN_TRADE_GAME);
    let current = record.setup;
    let node = record.variations[0];
    let ply = 0;
    const trades = [];
    while (node) {
      ply++;
      const move = node.move;
      assert(!move.pass, 'ply ' + ply + ' is a pass; the fixture must be placements only');
      const before = current.stones.length;
      const result = VGO.game.place(current, move.x, move.y);
      assert(result.ok, 'ply ' + ply + ' rejected: ' + result.reason);
      assert(result.position.passes === 0,
        'ply ' + ply + ' is a placement that changed the board, so it must reset the pass count');
      assert(result.position.phase === 'playing', 'the game finished at ply ' + ply + ' without a pass');
      if (result.position.stones.length === before) trades.push(ply);
      current = result.position;
      node = node.children[0];
    }
    assert(ply === 44, 'expected 44 plies, replayed ' + ply);
    assert(trades.join(',') === '43,44',
      'fixture must contain the even trades at plies 43 and 44, found ' + trades.join(','));
  });

  // A lone stone self-captured on arrival, taking nothing with it, leaves the
  // board identical -- the one case the pass rule is actually for, and the one
  // the fix above must not break.
  //
  // The position is lifted from a real shard rather than constructed, because a
  // constructed one silently had no legal no-op at all and the test passed
  // without exercising anything. Shares its fixture with
  // a_no_op_self_capture_counts_as_a_pass in crates/vgo-core/src/game.rs.
  test('a no-op placement still counts as a pass', function () {
    const start = VGO.model.createPosition({ radius:0.055714285714285716, toMove:'B', stones:[
      { x:0.52734375, y:0.55859375, c:'B' }, { x:0.68359375, y:0.58984375, c:'W' },
      { x:0.66015625, y:0.45703125, c:'B' }, { x:0.60546875, y:0.68359375, c:'W' },
      { x:0.35546875, y:0.55859375, c:'B' }, { x:0.76953125, y:0.49609375, c:'W' },
      { x:0.44921875, y:0.40234375, c:'B' }, { x:0.81640625, y:0.37890625, c:'W' },
      { x:0.32421875, y:0.68359375, c:'B' }, { x:0.33984375, y:0.30859375, c:'B' },
      { x:0.23828125, y:0.42578125, c:'B' }, { x:0.82421875, y:0.73046875, c:'W' },
      { x:0.18359375, y:0.71484375, c:'B' }, { x:0.42578125, y:0.20703125, c:'W' },
      { x:0.46484375, y:0.77734375, c:'B' }, { x:0.64453125, y:0.07421875, c:'W' },
      { x:0.59765625, y:0.29296875, c:'B' }, { x:0.48046875, y:0.66015625, c:'W' },
      { x:0.19921875, y:0.17578125, c:'B' }, { x:0.72265625, y:0.26953125, c:'W' },
      { x:0.70703125, y:0.78515625, c:'B' }, { x:0.5960043538276335, y:0.7946208004428714, c:'B' },
      { x:0.69140625, y:0.94140625, c:'W' }, { x:0.28515625, y:0.80078125, c:'B' },
      { x:0.84765625, y:0.23046875, c:'W' }, { x:0.44921875, y:0.92578125, c:'B' },
      { x:0.6055952782457028, y:0.1818223545601611, c:'W' }, { x:0.32421875, y:0.10546875, c:'B' },
      { x:0.80078125, y:0.85546875, c:'W' }, { x:0.76953125, y:0.05859375, c:'B' },
      { x:0.07421875, y:0.17578125, c:'B' }, { x:0.89453125, y:0.09765625, c:'W' },
      { x:0.06640625, y:0.70703125, c:'B' }, { x:0.47265625, y:0.10546875, c:'W' },
      { x:0.89453125, y:0.6387733214285715, c:'W' }, { x:0.2157783978145951, y:0.3162727288836293, c:'B' },
      { x:0.15301135558185364, y:0.5514488555818536, c:'B' }, { x:0.9180080332469719, y:0.9261099115477557, c:'W' },
      { x:0.07421875, y:0.35546875, c:'B' }, { x:0.93359375, y:0.43359375, c:'W' },
      { x:0.29296875, y:0.94140625, c:'B' }, { x:0.56640625, y:0.94140625, c:'W' },
      { x:0.06463485456016112, y:0.9180952782457028, c:'B' }, { x:0.17565472175429722, y:0.8259901454398388, c:'W' },
      { x:0.11191055388951679, y:0.07092015181722182, c:'B' }, { x:0.9282210508939471, y:0.7704696349592104, c:'W' },
    ] });
    assert(VGO.model.validate(start).playable, 'fixture is not playable');

    // Classify by the board itself, never by its stone count: an earlier
    // version of the Rust twin asked whether the count had changed -- the same
    // predicate the implementation used -- so it agreed with any behaviour that
    // predicate produced and could not fail on the bug it guarded.
    const key = function (p) {
      return p.stones.map(function (s) { return s.c + s.x + ',' + s.y; }).sort().join(';');
    };
    const beforeKey = key(start);
    let noOps = 0, realMoves = 0;
    for (const vertex of VGO.legalSet.vertices(start)) {
      const result = VGO.game.place(start, vertex[0], vertex[1]);
      if (!result.ok) continue;
      if (key(result.position) === beforeKey) {
        noOps++;
        assert(result.position.passes === 1,
          'a placement that left the board identical must count as a pass');
      } else {
        realMoves++;
        assert(result.position.passes === 0,
          'a placement that changed the board must reset the pass count, ' +
          'even when it removes as many stones as it adds');
      }
    }
    assert(noOps > 0, 'fixture must contain a no-op placement');
    assert(realMoves > 0, 'fixture must contain a real placement');
  });

  test('komi shifts the winner and is carried through play', function () {
    const stones = [{ x:0.25, y:0.5, c:'B' }, { x:0.75, y:0.5, c:'W' },
                    { x:0.25, y:0.2, c:'B' }, { x:0.5, y:0.8, c:'B' }];
    const plain = position(stones);
    const scores = VGO.analysis.analyze(plain).scores;
    const lead = scores.B - scores.W;
    assert(lead > 0, 'fixture must have Black ahead, or it cannot show a shift');
    assert(VGO.analysis.analyze(plain).result.winner === 'B', 'Black should lead at komi zero');

    // Komi above Black's lead has to hand the game to White; the raw areas are
    // untouched, because komi moves the verdict and not the board.
    const compensated = VGO.model.update(plain, { komi: lead + 0.01 });
    const after = VGO.analysis.analyze(compensated);
    assert(after.result.winner === 'W', 'komi above Black\'s lead must make White the winner');
    near(after.scores.B, scores.B, 1e-12);
    near(after.scores.W, scores.W, 1e-12);
    near(after.result.margin, 0.01, 1e-9);

    // Carried, not reset: komi belongs to the game, not the ply.
    const played = VGO.game.place(compensated, 0.5, 0.35);
    assert(played.ok, played.reason);
    near(played.position.komi, lead + 0.01, 1e-12);
    near(VGO.game.pass(played.position).position.komi, lead + 0.01, 1e-12);
  });

  test('komi round-trips through VGO-SGF', function () {
    const start = VGO.model.createPosition(
      { radius:0.05, stones:[{ x:0.3, y:0.3, c:'B' }], toMove:'W', komi:-0.125 });
    const text = VGO.sgf.serialize(start);
    assert(/KM\[-0\.125\]/.test(text), 'KM was not written: ' + text);
    near(VGO.sgf.parse(text).komi, -0.125, 1e-12);
    // A record written before KM existed scores at zero, not at NaN.
    near(VGO.sgf.parse('(;FF[4]GM[VGO]SZ[1]RA[0.05]PL[B]AB[0.5,0.5])').komi, 0, 1e-12);
  });

  test('serialization round-trips and invalid diagrams stay identifiable', function () {
    const start = position([{ x:0.2, y:0.3, c:'B' }, { x:0.8, y:0.7, c:'W' }], { toMove:'W' });
    const roundTrip = VGO.sgf.parse(VGO.sgf.serialize(start));
    assert(roundTrip.stones.length === 2 && roundTrip.toMove === 'W');
    near(roundTrip.radius, start.radius, 1e-12);
    const invalid = VGO.sgf.parse('(;FF[4]GM[VGO]SZ[1]RA[0.10000]PL[B]AB[0.5,0.5]AW[0.55,0.5])');
    assert(!VGO.model.validate(invalid).playable, 'overlapping imported stones were accepted as playable');
  });

  const output = document.getElementById('result');
  if (failures.length) {
    output.dataset.status = 'fail';
    output.textContent = 'FAIL ' + failures.length + '/' + (passed + failures.length) + '\n' + failures.join('\n');
  } else {
    output.dataset.status = 'pass';
    output.textContent = 'PASS ' + passed + '/' + passed;
  }
})();
</script>
</body>
</html>
